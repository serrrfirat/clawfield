<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clawfield - Voxel Viewer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #1a1a2e; font-family: monospace; color: #e0e0e0; }
      canvas { display: block; }
      #top-bar {
        position: fixed; top: 0; left: 0; right: 0;
        height: 40px; background: rgba(20, 20, 40, 0.9);
        display: flex; align-items: center; gap: 12px;
        padding: 0 16px; z-index: 10;
        border-bottom: 1px solid #333;
      }
      #top-bar label { font-size: 13px; cursor: pointer; }
      #file-input { display: none; }
      #file-btn {
        background: #3a3a5c; border: 1px solid #555; color: #e0e0e0;
        padding: 4px 12px; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 13px;
      }
      #file-btn:hover { background: #4a4a7c; }
      #model-name { font-size: 14px; color: #aaa; }
      #wireframe-toggle { margin-left: auto; display: flex; align-items: center; gap: 6px; }
      #bottom-bar {
        position: fixed; bottom: 0; left: 0; right: 0;
        height: 28px; background: rgba(20, 20, 40, 0.9);
        display: flex; align-items: center; gap: 16px;
        padding: 0 16px; z-index: 10; font-size: 12px; color: #888;
        border-top: 1px solid #333;
      }
      #drop-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(60, 60, 120, 0.6); z-index: 100;
        display: none; align-items: center; justify-content: center;
        font-size: 24px; color: white; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="top-bar">
      <button id="file-btn">Open .vobj.json</button>
      <input id="file-input" type="file" accept=".json" />
      <span id="model-name">No model loaded</span>
      <div id="wireframe-toggle">
        <label><input type="checkbox" id="wireframe-cb" /> Wireframe</label>
      </div>
    </div>
    <div id="bottom-bar">
      <span id="info-dims">--</span>
      <span id="info-voxels">--</span>
      <span id="info-palette">--</span>
      <span id="info-world">--</span>
    </div>
    <div id="drop-overlay">Drop .vobj.json file here</div>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
