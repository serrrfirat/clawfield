<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clawfield</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }
      canvas { display: block; }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        pointer-events: none;
        z-index: 10;
        display: none;
        transition: opacity 0.15s ease;
      }
      #overlay {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-family: monospace;
        font-size: 18px;
        text-align: center;
        z-index: 20;
        pointer-events: none;
      }
      #name-labels {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 5;
      }
      .name-label {
        position: absolute;
        color: white;
        font-family: monospace;
        font-size: 12px;
        text-align: center;
        text-shadow: 0 0 4px black;
        pointer-events: none;
        transform: translate(-50%, -100%);
      }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="overlay">Click to play</div>
    <div id="name-labels"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
